<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3H3D - Official Website</title>
    <!-- FontAwesome untuk Ikon Sosial Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* Navbar Atas */
        nav {
            display: flex;
            gap: 30px;
            padding-top: 30px;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* Konten Tengah (Logo & Tombol) */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Gaya Logo Sinematik */
        .logo-text {
            font-size: 80px;
            font-style: italic;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 
                         0 0 20px rgba(100, 100, 255, 0.5), 
                         0 0 30px rgba(100, 100, 255, 0.3);
            animation: fadeInLogo 1.5s ease-in;
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Listen Now */
        .btn-listen {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-listen:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        /* Footer Bawah */
        .footer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            font-size: 12px;
            color: #aaaaaa;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 18px;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }

        /* Tombol Widget Cookie di Kiri Bawah (Terang & Jelas) */
        .cookie-icon-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            z-index: 999;
            transition: background 0.3s, transform 0.3s;
        }

        .cookie-icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Menu Navigasi -->
    <nav>
        <a href="#">HOME</a>
        <a href="#">VIDEO</a>
        <a href="#">MUSIC</a>
    </nav>

    <!-- Konten Utama -->
    <div class="content">
        <div class="logo-text">3H3D</div>
        <a href="#" class="btn-listen">Listen Now</a>
    </div>

    <!-- Footer Bawah -->
    <div class="footer">
        <span>© Ferwap music. All Rights Reserved | Privacy Policy | Terms Of Service.</span>
        <div class="social-icons">
            <!-- Facebook -->
            <a href="https://www.facebook.com/3h3dofficial" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <!-- X (Twitter) -->
            <a href="https://x.com/3h3dofficial" target="_blank" title="X"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
            <!-- Instagram -->
            <a href="https://www.instagram.com/3h3dofficial" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <!-- YouTube -->
            <a href="https://www.youtube.com/@3h3dofficial" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <!-- Ikon Cookie di Kiri Bawah -->
    <div class="cookie-icon-btn" onclick="alert('Pengaturan Cookie & Privasi aktif untuk 3H3D.')" title="Privacy & Cookie Preferences">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M21.5 11.5c-.3-.1-.6 0-.8.2-.5.5-1.2.8-2 .8-1.7 0-3-1.3-3-3 0-.8.3-1.5.8-2 .2-.2.3-.5.2-.8-.1-.3-.4-.5-.7-.4C13.8 7.1 12 9.3 12 12c0 2.8 2.2 5 5 5 2.7 0 4.9-1.8 5.3-4.3 0-.3-.2-.6-.5-.7zM17 14c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-4-7.5c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1zm-6 3c0-.3-.2-.5-.5-.5h-2c-.3 0-.5.2-.5.5v2c0 .3.2.5.5.5h2c.3 0 .5-.2.5-.5v-2zm2 7c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1z"/></svg>
    </div>

</body>
</html>
