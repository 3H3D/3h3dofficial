<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3H3D - Official Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }
        /* Latar Belakang Gambar Sinematik */
        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('URL_FOTO_ANDA_DISINI') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 20px;
        }
        /* Efek Gelap Transparan di atas Gambar */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }
        /* Navigasi Tepat di Tengah Atas */
        nav {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 30px;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 600;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        nav a:hover {
            opacity: 0.7;
        }
        /* Konten Tengah (Nama & Tombol) */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: auto;
            margin-top: 25vh;
        }
        .logo-text {
            font-size: 64px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }
        .btn-listen {
            display: inline-block;
            padding: 12px 35px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            background: transparent;
            transition: all 0.3s ease;
        }
        .btn-listen:hover {
            background: #ffffff;
            color: #000000;
        }
        /* Footer / Media Sosial */
        .footer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.8;
        }
        .social-icons {
            display: flex;
            gap: 15px;
        }
        .social-icons a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            nav {
                gap: 15px;
                font-size: 11px;
                letter-spacing: 1px;
            }
            .logo-text {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <!-- Menu Navigasi Persis di Tengah Atas -->
        <nav>
            <a href="#">Home</a>
            <a href="#">Video</a>
            <a href="#">Music</a>
          
            
        </nav>

        <!-- Bagian Tengah: Judul & Tombol -->
        <div class="content">
            <div class="logo-text">3H3D</div>
            <a href="#" class="btn-listen">Listen Now</a>
        </div>

        <!-- Footer Bawah -->
        <div class="footer">
            <span>© Ferwap music. All Rights Reserved | Privacy Policy | Terms Of Service.</span>
            <div class="social-icons">
                <a href="#">IG</a>
                <a href="#">YT</a>
                <a href="#">X</a>
            </div>
        </div>
    </div>

</body>
</html>
