<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3H3D - Official Website</title>
    <!-- FontAwesome untuk ikon media sosial -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- RESET & GLOBAL STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url('path-to-your-background-image.jpg'); /* Ganti background jika ada */
            background-size: cover;
            background-position: center;
        }

        /* --- HEADER / NAVIGASI --- */
        header {
            width: 100%;
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-menu a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .nav-menu a:hover {
            color: #aaaaaa;
        }

        /* --- KONTEN UTAMA (TENGAH) --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            margin-top: -30px; /* Sedikit penyeimbang posisi vertikal */
        }

        .brand-logo {
            font-size: clamp(4rem, 12vw, 8rem); /* Ukuran otomatis menyesuaikan layar */
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .listen-btn {
            display: inline-block;
            padding: 12px 35px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.3);
        }

        .listen-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        /* --- FOOTER (BAWAH) --- */
        footer {
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: #aaaaaa;
            background: transparent;
        }

        .copyright {
            line-height: 1.5;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .social-icons a:hover {
            color: #aaaaaa;
        }

        /* --- RESPONSIF KHUSUS HP (LAYAR KECIL) --- */
        @media screen and (max-width: 768px) {
            header {
                padding: 15px 10px;
            }

            .nav-menu {
                gap: 20px;
                font-size: 0.8rem;
            }

            /* Footer di HP berubah menjadi susunan ke bawah (vertikal) agar rapi dan tidak terpotong */
            footer {
                flex-direction: column-reverse;
                align-items: center;
                text-align: center;
                gap: 15px;
                padding: 15px 20px;
            }

            .social-icons {
                margin-bottom: 5px;
            }

            .copyright {
                font-size: 0.7rem;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Menu Navigasi -->
    <header>
        <ul class="nav-menu">
            <li><a href="#">HOME</a></li>
            <li><a href="#">VIDEO</a></li>
            <li><a href="#">MUSIC</a></li>
        </ul>
    </header>

    <!-- Konten Utama -->
    <main>
        <h1 class="brand-logo">3H3D</h1>
        <a href="#" class="listen-btn">LISTEN NOW</a>
    </main>

    <!-- Footer (Copyright & Media Sosial) -->
    <footer>
        <div class="copyright">
            &copy; 2026 3H3D OFFICIAL. ALL RIGHTS RESERVED. <br>
            TERMS AND CONDITIONS | PRIVACY POLICY
        </div>
        <div class="social-icons">
            <a href="#" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="#" target="_blank"><i class="fab fa-x-twitter"></i></a>
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
    </footer>

</body>
</html>
