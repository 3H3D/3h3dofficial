<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3H3D - Official Website</title>
    <!-- FontAwesome untuk Ikon Sosial Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts untuk Font Gaul/Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Mengunci halaman agar pas di 1 layar penuh dan TIDAK BISA SCROLL */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: linear-gradient(135deg, rgba(11, 11, 11, 0.95), rgba(30, 30, 30, 0.85));
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Navbar Default untuk Laptop / Komputer */
        nav.desktop-nav {
            display: flex;
            gap: 30px;
            padding-top: 30px;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
            z-index: 10;
        }

        nav.desktop-nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        nav.desktop-nav a:hover {
            opacity: 0.7;
        }

        /* Tombol MENU & Menu Fullscreen HP (Wajib disembunyikan di Laptop) */
        .menu-toggle, 
        .mobile-fullscreen-menu {
            display: none !important;
        }

        /* Konten Utama */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 100%;
        }

        /* Gaya Logo */
        .logo-text {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: clamp(3rem, 12vw, 70px);
            letter-spacing: 4px;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 
                         0 0 30px rgba(100, 100, 255, 0.6), 
                         0 0 45px rgba(100, 100, 255, 0.4);
            animation: fadeInLogo 1.5s ease-in;
            word-break: break-word;
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Listen Now */
        .btn-listen {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-listen:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        /* Modal / Kotak Daftar Menu (Video & Music) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .modal-content h2 {
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .link-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .link-item {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s;
            border-radius: 5px;
        }

        .link-item:hover {
            background: #ffffff;
            color: #0b0b0b;
        }

        .close-btn {
            margin-top: 20px;
            padding: 8px 20px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #ffffff;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Footer Bawah - Bersih tanpa border */
        .footer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            font-size: 11px;
            color: #aaaaaa;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 16px;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }

        /* Tombol Cookie di Kiri Bawah */
        .cookie-icon-btn {
            position: fixed;
            bottom: 15px;
            left: 20px;
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            z-index: 999;
            transition: background 0.3s, transform 0.3s;
        }

        .cookie-icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* PENGATURAN KHUSUS HP (Max-width 768px) */
        @media screen and (max-width: 768px) {
            /* Sembunyikan navbar laptop di HP */
            nav.desktop-nav {
                display: none !important;
            }

            /* Munculkan tombol MENU khusus HP */
            .menu-toggle {
                display: block !important;
                background: none;
                border: none;
                color: #ffffff;
                font-size: 14px;
                letter-spacing: 3px;
                font-weight: bold;
                cursor: pointer;
                padding-top: 25px;
                z-index: 1001;
            }

            /* Overlay Menu Fullscreen HP */
            .mobile-fullscreen-menu {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(11, 11, 11, 0.95);
                backdrop-filter: blur(15px);
                z-index: 1000;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
            }

            .mobile-fullscreen-menu.active {
                display: flex !important;
            }

            .mobile-fullscreen-menu a {
                color: #ffffff;
                text-decoration: none;
                font-size: 22px;
                letter-spacing: 4px;
                font-weight: bold;
                transition: opacity 0.3s;
            }

            .mobile-fullscreen-menu a:hover {
                opacity: 0.6;
            }

            .close-menu-btn {
                position: absolute;
                top: 25px;
                background: none;
                border: none;
                color: #ffffff;
                font-size: 16px;
                letter-spacing: 2px;
                cursor: pointer;
            }

            .footer {
                flex-direction: column-reverse;
                align-items: center;
                text-align: center;
                gap: 10px;
                padding: 15px 20px;
            }

            .cookie-icon-btn {
                bottom: 10px;
                left: 15px;
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol MENU khusus HP -->
    <button class="menu-toggle" onclick="toggleMobileMenu()">MENU</button>

    <!-- Navigasi Biasa untuk Laptop / Komputer -->
    <nav class="desktop-nav">
        <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">HOME</a>
        <a onclick="openModal('videoModal')">VIDEO</a>
        <a onclick="openModal('musicModal')">MUSIC</a>
    </nav>

    <!-- Menu Layar Penuh (Fullscreen) Khusus HP -->
    <div id="mobileMenu" class="mobile-fullscreen-menu">
        <button class="close-menu-btn" onclick="toggleMobileMenu()">TUTUP</button>
        <a href="#" onclick="toggleMobileMenu(); window.scrollTo({top: 0, behavior: 'smooth'}); return false;">HOME</a>
        <a onclick="toggleMobileMenu(); openModal('musicModal');">MUSIC</a>
        <a onclick="toggleMobileMenu(); openModal('videoModal');">VIDEO</a>
    </div>

    <!-- Konten Utama -->
    <div class="content">
        <div class="logo-text">3H3D</div>
        <a href="https://ffm.to/kwiregtori" target="_blank" class="btn-listen">Listen Now</a>
    </div>

    <!-- Modal Daftar Video -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <h2>PILIHAN VIDEO</h2>
            <div class="link-list">
                <a href="https://www.youtube.com/watch?v=4yGWl7lwwUY" target="_blank" class="link-item">Video Official 1</a>
                <a href="https://www.youtube.com/watch?v=MJS3ca-VP-8" target="_blank" class="link-item">Video Official 2</a>
                <a href="https://www.youtube.com/watch?v=acjp11UXUeA" target="_blank" class="link-item">Video Official 3</a>
                <a href="https://www.youtube.com/watch?v=H9o2nzykIso" target="_blank" class="link-item">Video Official 4</a>
            </div>
            <button class="close-btn" onclick="closeModal('videoModal')">TUTUP</button>
        </div>
    </div>

    <!-- Modal Daftar Musik -->
    <div id="musicModal" class="modal">
        <div class="modal-content">
            <h2>PLATFORM MUSIK</h2>
            <div class="link-list">
                <a href="https://ffm.to/kwiregtori" target="_blank" class="link-item">Kwiregtori</a>
                <a href="https://ffm.to/sogdai-ya" target="_blank" class="link-item">Sogdai-Ya</a>
                <a href="https://ffm.to/toru-re" target="_blank" class="link-item">Toru-Re</a>
                <a href="https://ffm.to/og-wesa" target="_blank" class="link-item">Og-Wesa</a>
            </div>
            <button class="close-btn" onclick="closeModal('musicModal')">TUTUP</button>
        </div>
    </div>

    <!-- Footer Bawah -->
    <div class="footer">
        <span>© 2026 3H3D OFFICIAL. ALL RIGHTS RESERVED. TERMS AND CONDITIONS | PRIVACY POLICY</span>
        <div class="social-icons">
            <a href="https://www.facebook.com/3h3dofficial" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://x.com/3h3dofficial" target="_blank" title="X"><svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
            <a href="https://www.instagram.com/3h3dofficial" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.youtube.com/@3h3dofficial" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <!-- Ikon Cookie di Kiri Bawah -->
    <div class="cookie-icon-btn" onclick="alert('Pengaturan Cookie & Privasi aktif untuk 3H3D.')" title="Privacy & Cookie Preferences">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M21.5 11.5c-.3-.1-.6 0-.8.2-.5.5-1.2.8-2 .8-1.7 0-3-1.3-3-3 0-.8.3-1.5.8-2 .2-.2.3-.5.2-.8-.1-.3-.4-.5-.7-.4C13.8 7.1 12 9.3 12 12c0 2.8 2.2 5 5 5 2.7 0 4.9-1.8 5.3-4.3 0-.3-.2-.6-.5-.7zM17 14c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-4-7.5c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1zm-6 3c0-.3-.2-.5-.5-.5h-2c-.3 0-.5.2-.5.5v2c0 .3.2.5.5.5h2c.3 0 .5-.2.5-.5v-2zm2 7c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c0 .3.2.5.5.5v-1z"/></svg>
    </div>

    <!-- JavaScript untuk Navigasi & Modal -->
    <script>
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            mobileMenu.classList.toggle('active');
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>

</body>
</html>
