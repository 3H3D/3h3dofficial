<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3H3D - Official Website</title>
    <!-- FontAwesome untuk Ikon Sosial Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts untuk Font Gaul/Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, rgba(11, 11, 11, 0.95), rgba(30, 30, 30, 0.85));
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* Navbar Atas */
        nav {
            display: flex;
            gap: 30px;
            padding-top: 30px;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: bold;
            z-index: 10;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* Konten Tengah (Logo & Tombol) */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Gaya Logo Font Gaul & Modern */
        .logo-text {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: 70px;
            letter-spacing: 4px;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 
                         0 0 30px rgba(100, 100, 255, 0.6), 
                         0 0 45px rgba(100, 100, 255, 0.4);
            animation: fadeInLogo 1.5s ease-in;
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Listen Now */
        .btn-listen {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-listen:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        /* Modal / Kotak Daftar Menu (Video & Music) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: transparent;
            border: none;
            padding: 20px;
            width: 100%;
            max-width: 650px;
            height: 88vh;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-content h2 {
            font-size: 18px;
            letter-spacing: 5px;
            margin-bottom: 25px;
            color: #aaaaaa;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* Container Scroll Vertikal ke Bawah */
        .vertical-scroll-container {
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding-right: 5px;
            padding-bottom: 30px;
        }

        /* Styling Scrollbar Halus */
        .vertical-scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .vertical-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .item-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Gaya Artwork Musik (Kotak) */
        .music-art {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
            filter: sepia(0.3) contrast(1.1);
        }

        /* Gaya Thumbnail Video (Landscape / Melebar) */
        .video-art {
            width: 100%;
            max-width: 480px;
            height: 270px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
        }

        /* Tombol Aksi di Bawah Artwork */
        .btn-action {
            display: inline-block;
            padding: 9px 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        .close-btn {
            margin-top: 15px;
            padding: 8px 25px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #888888;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .close-btn:hover {
            color: #ffffff;
            border-color: #ffffff;
        }

        /* Footer Bawah Transparan */
        .footer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            font-size: 12px;
            color: #aaaaaa;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 18px;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }

        /* Tombol Widget Cookie di Kiri Bawah */
        .cookie-icon-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            z-index: 999;
            transition: background 0.3s, transform 0.3s;
        }

        .cookie-icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Responsif untuk HP */
        @media screen and (max-width: 768px) {
            .video-art {
                width: 90vw;
                height: 50.6vw;
            }
            .music-art {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>

    <!-- Menu Navigasi -->
    <nav>
        <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">HOME</a>
        <a onclick="openModal('videoModal')">VIDEO</a>
        <a onclick="openModal('musicModal')">MUSIC</a>
    </nav>

    <!-- Konten Utama -->
    <div class="content">

                <div class="item-card">

                <div class="item-card">

                <div class="item-card">
                    <img src="https://img.youtube.com/vi/acjp11UXUeA/hqdefault.jpg" alt="Video Official 3" class="video-art">
                    <a href="https://www.youtube.com/watch?v=acjp11UXUeA" target="_blank" class="btn-action">Watch Now</a>
                </div>
                <!-- Video 4 -->
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/H9o2nzykIso/hqdefault.jpg" alt="Video Official 4" class="video-art">
                    <a href="https://www.youtube.com/watch?v=H9o2nzykIso" target="_blank" class="btn-action">Watch Now</a>
                </div>
            </div>
            <button class="close-btn" onclick="closeModal('videoModal')">TUTUP</button>

    <!-- Modal Daftar Musik (4 Lagu Kotak Vertikal dengan Tema Selaras) -->
    <div id="musicModal" class="modal">

            <div class="vertical-scroll-container">
                <!-- Lagu 1 -->
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80" alt="Kwiregtori" class="music-art">
                    <a href="https://ffm.to/kwiregtori" target="_blank" class="btn-action">Get It Now</a>
                </div>
                <!-- Lagu 2 -->
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=600&q=80" alt="Sogdai-Ya" class="music-art">
                    <a href="https://ffm.to/sogdai-ya" target="_blank" class="btn-action">Get It Now</a>
                </div>
                <!-- Lagu 3 -->
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80" alt="Toru-Re" class="music-art">
                    <a href="https://ffm.to/toru-re" target="_blank" class="btn-action">Get It Now</a>
                </div>
                <!-- Lagu 4 -->
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&w=600&q=80" alt="Og-Wesa" class="music-art">
                    <a href="https://ffm.to/og-wesa" target="_blank" class="btn-action">Get It Now</a>
                </div>
            </div>
            <button class="close-btn" onclick="closeModal('musicModal')">TUTUP</button>
        </div>
    </div>

    <!-- Footer Bawah -->
    <div class="footer">
        <span>© Ferwap music. All Rights Reserved | Privacy Policy | Terms Of Service.</span>
        <div class="social-icons">
            <a href="https://www.facebook.com/3h3dofficial" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://x.com/3h3dofficial" target="_blank" title="X"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
            <a href="https://www.instagram.com/3h3dofficial" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.youtube.com/@3h3dofficial" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <!-- Ikon Cookie di Kiri Bawah -->
    <div class="cookie-icon-btn" onclick="alert('Pengaturan Cookie & Privasi aktif untuk 3H3D.')" title="Privacy & Cookie Preferences">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M21.5 11.5c-.3-.1-.6 0-.8.2-.5.5-1.2.8-2 .8-1.7 0-3-1.3-3-3 0-.8.3-1.5.8-2 .2-.2.3-.5.2-.8-.1-.3-.4-.5-.7-.4C13.8 7.1 12 9.3 12 12c0 2.8 2.2 5 5 5 2.7 0 4.9-1.8 5.3-4.3 0-.3-.2-.6-.5-.7zM17 14c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-4-7.5c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1zm-6 3c0-.3-.2-.5-.5-.5h-2c-.3 0-.5.2-.5.5v2c0 .3.2.5.5.5h2c0 .3.2.5.5.5v-2zm2 7c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c0 .3.2.5.5.5v-1z"/></svg>
    </div>

    <!-- JavaScript untuk Menampilkan/Menutup Modal -->
    <script>
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>

</body>
</html>
