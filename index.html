<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3H3D - Official Website</title>
    <!-- FontAwesome untuk Ikon Sosial Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts untuk Font Gaul/Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Mengunci halaman utama agar pas di 1 layar penuh */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: linear-gradient(135deg, rgba(11, 11, 11, 0.95), rgba(30, 30, 30, 0.85));
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Navbar Default untuk Laptop / Komputer */
        nav.desktop-nav {
            display: flex;
            gap: 45px;
            padding-top: 35px;
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: bold;
            z-index: 10;
        }

        nav.desktop-nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        nav.desktop-nav a:hover {
            opacity: 0.7;
        }

        /* Tombol MENU & Menu Fullscreen HP (Default disembunyikan di Desktop) */
        .menu-toggle, 
        .mobile-fullscreen-menu {
            display: none;
        }

        /* Konten Utama */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 100%;
        }

        /* Gaya Logo */
        .logo-text {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: clamp(3rem, 12vw, 70px);
            letter-spacing: 4px;
            margin-bottom: 25px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 
                         0 0 30px rgba(100, 100, 255, 0.6), 
                         0 0 45px rgba(100, 100, 255, 0.4);
            animation: fadeInLogo 1.5s ease-in;
            word-break: break-word;
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Listen Now */
        .btn-listen {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-listen:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        /* Modal / Kotak Popup Vertikal ke Bawah */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(12px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: transparent;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
            height: 88vh;
            padding: 20px;
        }

        .modal-content h2 {
            font-size: 18px;
            letter-spacing: 5px;
            margin-bottom: 25px;
            color: #aaaaaa;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* Area Daftar Item Vertikal (Bisa Di-scroll ke Bawah) */
        .vertical-scroll-container {
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            padding-right: 5px;
            padding-bottom: 30px;
        }

        /* Scrollbar Halus */
        .vertical-scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .vertical-scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .item-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Gaya Khusus Musik (Artwork Kotak) */
        .music-art {
            width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 15px;
            filter: sepia(0.3) contrast(1.1);
        }

        /* Gaya Khusus Video (Artwork Landscape / Melebar ke Samping) */
        .video-art {
            width: 100%;
            max-width: 520px;
            height: 295px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 15px;
        }

        /* Tombol Aksi di Bawah Artwork */
        .btn-action {
            display: inline-block;
            padding: 10px 35px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        .close-modal-btn {
            margin-top: 15px;
            background: none;
            border: none;
            color: #888888;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s;
            flex-shrink: 0;
        }

        .close-modal-btn:hover {
            color: #ffffff;
        }

        /* Footer Bawah */
        .footer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            font-size: 11px;
            color: #aaaaaa;
            background: transparent;
            border: none;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 16px;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }

        /* Tombol Cookie di Kiri Bawah */
        .cookie-icon-btn {
            position: fixed;
            bottom: 15px;
            left: 20px;
            width: 36px;
            height: 36px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            z-index: 999;
            transition: background 0.3s, transform 0.3s;
        }

        .cookie-icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* PENGATURAN KHUSUS HP (Max-width 768px) */
        @media screen and (max-width: 768px) {
            nav.desktop-nav {
                display: none !important;
            }

            .menu-toggle {
                display: block !important;
                background: none;
                border: none;
                color: #ffffff;
                font-size: 22px;
                letter-spacing: 5px;
                font-weight: bold;
                cursor: pointer;
                padding-top: 30px;
                z-index: 1001;
            }

            .mobile-fullscreen-menu {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(11, 11, 11, 0.98);
                backdrop-filter: blur(15px);
                z-index: 1000;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                gap: 25px !important;
            }

            .mobile-fullscreen-menu.active {
                display: flex !important;
            }

            .mobile-fullscreen-menu a {
                color: #ffffff;
                text-decoration: none;
                font-size: 22px;
                letter-spacing: 4px;
                font-weight: bold;
                padding: 10px;
                display: block !important;
                width: 100%;
                text-align: center;
                transition: opacity 0.3s;
            }

            .mobile-fullscreen-menu a:hover {
                opacity: 0.6;
            }

            .music-art {
                width: 250px;
                height: 250px;
            }

            .video-art {
                width: 90vw;
                height: 50vw;
            }

            .footer {
                flex-direction: column-reverse;
                align-items: center;
                text-align: center;
                gap: 10px;
                padding: 15px 20px;
            }

            .cookie-icon-btn {
                bottom: 10px;
                left: 15px;
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol MENU khusus HP -->
    <button class="menu-toggle" onclick="toggleMobileMenu()">MENU</button>

    <!-- Navigasi Biasa untuk Laptop / Komputer -->
    <nav class="desktop-nav">
        <a href="#" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); return false;">HOME</a>
        <a onclick="openModal('videoModal')">VIDEO</a>
        <a onclick="openModal('musicModal')">MUSIC</a>
    </nav>

    <!-- Menu Layar Penuh (Fullscreen) Khusus HP -->
    <div id="mobileMenu" class="mobile-fullscreen-menu">
        <a href="#" onclick="toggleMobileMenu(); window.scrollTo({top: 0, behavior: 'smooth'}); return false;">HOME</a>
        <a onclick="toggleMobileMenu(); openModal('musicModal');">MUSIC</a>

    <!-- Konten Utama -->
    <div class="content">
        <div class="logo-text">3H3D</div>

    <!-- Modal Musik (4 Lagu dengan Artwork Selaras Tema Video) -->

                </div>
                <!-- Lagu 2 -->
                <div class="item-card">

                <!-- Lagu 3 -->
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80" alt="Music 3" class="music-art">
                    <a href="https://ffm.to/toru-re" target="_blank" class="btn-action">Get It Now</a>
                </div>
                <!-- Lagu 4 -->
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&w=600&q=80" alt="Music 4" class="music-art">
                    <a href="https://ffm.to/og-wesa" target="_blank" class="btn-action">Get It Now</a>
                </div>
            </div>

            <button class="close-modal-btn" onclick="closeModal('musicModal')">Tutup</button>
        </div>
    </div>

    <!-- Modal Video (4 Video Lanskap Vertikal) -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <h2>VIDEOS</h2>
            
            <div class="vertical-scroll-container">
                <!-- Video 1 -->
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/4yGWl7lwwUY/hqdefault.jpg" alt="Video 1" class="video-art">
                    <a href="https://www.youtube.com/watch?v=4yGWl7lwwUY" target="_blank" class="btn-action">Watch Now</a>
                </div>
                <!-- Video 2 -->
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/MJS3ca-VP-8/hqdefault.jpg" alt="Video 2" class="video-art">
                    <a href="https://www.youtube.com/watch?v=MJS3ca-VP-8" target="_blank" class="btn-action">Watch Now</a>
                </div>
                <!-- Video 3 -->
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/acjp11UXUeA/hqdefault.jpg" alt="Video 3" class="video-art">
                    <a href="https://www.youtube.com/watch?v=acjp11UXUeA" target="_blank" class="btn-action">Watch Now</a>
                </div>
                <!-- Video 4 -->
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/H9o2nzykIso/hqdefault.jpg" alt="Video 4" class="video-art">
                    <a href="https://www.youtube.com/watch?v=H9o2nzykIso" target="_blank" class="btn-action">Watch Now</a>
                </div>
            </div>

            <button class="close-modal-btn" onclick="closeModal('videoModal')">Tutup</button>
        </div>
    </div>

    <!-- Footer Bawah -->
    <div class="footer">
        <span>© 2026 3H3D OFFICIAL. ALL RIGHTS RESERVED. TERMS AND CONDITIONS | PRIVACY POLICY</span>
        <div class="social-icons">
            <a href="https://www.facebook.com/3h3dofficial" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>

            <a href="https://www.instagram.com/3h3dofficial" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.youtube.com/@3h3dofficial" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <!-- Ikon Cookie di Kiri Bawah -->
    <div class="cookie-icon-btn" onclick="alert('Pengaturan Cookie & Privasi aktif untuk 3H3D.')" title="Privacy & Cookie Preferences">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M21.5 11.5c-.3-.1-.6 0-.8.2-.5.5-1.2.8-2 .8-1.7 0-3-1.3-3-3 0-.8.3-1.5.8-2 .2-.2.3-.5.2-.8-.1-.3-.4-.5-.7-.4C13.8 7.1 12 9.3 12 12c0 2.8 2.2 5 5 5 2.7 0 4.9-1.8 5.3-4.3 0-.3-.2-.6-.5-.7zM17 14c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-4-7.5c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1zm-6 3c0-.3-.2-.5-.5-.5h-2c-.3 0-.5.2-.5.5v2c0 .3.2.5.5.5h2c0 .3.2.5.5.5v-2zm2 7c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c0 .3.2.5.5.5v-1z"/></svg>
    </div>

    <!-- JavaScript -->
    <script>
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            mobileMenu.classList.toggle('active');
        }

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
    </script>

</body>
</html>
