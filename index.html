<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3H3D - Official Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            background: #0b0b0b;
        }
        nav {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 30px;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 600;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        nav a:hover {
            opacity: 0.7;
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .logo-text {
            font-size: 64px;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        .btn-listen {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-listen:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }
        .footer {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #aaaaaa;
        }
        .social-icons {
            display: flex;
            gap: 20px;
        }
        .social-icons a {
            color: #ffffff;
            font-size: 18px;
            text-decoration: none;
            transition: opacity 0.3s;
        }
        .social-icons a:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="hero">
        <nav>
            <a href="#">Home</a>
            <a href="#">Video</a>
            <a href="#">Music</a>
        </nav>

        <div class="content">
            <div class="logo-text">3H3D</div>
            <a href="#" class="btn-listen">Listen Now</a>
        </div>

        <div class="footer">
            <span>© Ferwap music. All Rights Reserved | Privacy Policy | Terms Of Service.</span>
            <div class="social-icons">
                <a href="https://www.facebook.com/3h3dofficial" target="_blank"><i class="fab fa-facebook-f"></i></a>
                <a href="https://x.com/3h3dofficial" target="_blank"><i class="fab fa-x-twitter"></i></a>
                <a href="https://www.instagram.com/3h3dofficial" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.youtube.com/@3h3dofficial" target="_blank"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </div>

</body>
</html>
