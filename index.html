<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3H3D - Official Website</title>
    <!-- FontAwesome untuk Ikon Sosial Media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Halaman diatur agar bisa di-scroll secara normal */
        html, body {
            width: 100%;
            min-height: 100%;
            background: linear-gradient(135deg, rgba(11, 11, 11, 0.95), rgba(30, 30, 30, 0.85));
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Navbar Default untuk Komputer / Laptop */
        nav.desktop-nav {
            display: flex;
            gap: 45px;
            padding-top: 35px;
            font-size: 16px;
            letter-spacing: 3px;
            font-weight: bold;
            z-index: 10;
        }

        nav.desktop-nav a {
            color: #ffffff;
            text-decoration: none;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        nav.desktop-nav a:hover {
            opacity: 0.7;
        }

        /* Tombol MENU & Menu Fullscreen HP */
        .menu-toggle, 
        .mobile-fullscreen-menu {
            display: none;
        }

        /* Konten Utama (Logo & Tombol Listen Now di tengah awal) */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            min-height: calc(100vh - 120px); /* Mengisi tinggi layar awal */
            z-index: 5;
            padding: 40px 20px;
        }

        /* Gaya Logo */
        .logo-text {
            font-family: 'Rubik Mono One', sans-serif;
            font-size: clamp(2.5rem, 8vw, 65px);
            letter-spacing: 4px;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 
                         0 0 30px rgba(100, 100, 255, 0.6), 
                         0 0 45px rgba(100, 100, 255, 0.4);
            animation: fadeInLogo 1.5s ease-in;
            word-break: break-word;
        }

        @keyframes fadeInLogo {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Listen Now */
        .btn-listen {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn-listen:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        /* Modal / Kotak Popup yang Berubah Jadi Bagian Halaman Bawah (Bisa di-scroll) */
        .modal {
            display: none; /* Akan diubah jadi 'flex' atau 'block' via JavaScript saat menu diklik */
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px 20px 80px 20px;
            flex-direction: column;
            align-items: center;
        }

        .modal-content {
            background: transparent;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
        }

        .modal-content h2 {
            font-size: 18px;
            letter-spacing: 5px;
            margin-bottom: 30px;
            color: #aaaaaa;
            text-transform: uppercase;
        }

        /* Area Daftar Item Vertikal */
        .vertical-scroll-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        .item-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .music-art {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
            filter: sepia(0.3) contrast(1.1);
        }

        .video-art {
            width: 100%;
            max-width: 480px;
            height: 270px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 12px;
        }

        .btn-action {
            display: inline-block;
            padding: 9px 30px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        .close-modal-btn {
            margin-top: 30px;
            background: none;
            border: none;
            color: #888888;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .close-modal-btn:hover {
            color: #ffffff;
        }

        /* Footer Bawah Sekarang Mengikuti Alur Scroll (Tidak Fixed Lagi) */
        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            font-size: 11px;
            color: #aaaaaa;
            background: rgba(11, 11, 11, 0.95);
            margin-top: auto;
        }

        .social-icons {
            display: flex;
            gap: 20px;
        }

        .social-icons a {
            color: #ffffff;
            font-size: 16px;
            text-decoration: none;
            transition: opacity 0.3s;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }

        /* Tombol Cookie di Kiri Bawah (Ikut alur scroll halaman) */
        .cookie-icon-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            cursor: pointer;
            z-index: 3001;
            transition: background 0.3s, transform 0.3s;
        }

        .cookie-icon-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        /* Pengaturan Khusus HP */
        @media screen and (max-width: 768px) {
            nav.desktop-nav {
                display: none !important;
            }

            .menu-toggle {
                display: block !important;
                background: none;
                border: none;
                color: #ffffff;
                font-size: 22px;
                letter-spacing: 5px;
                font-weight: bold;
                cursor: pointer;
                padding-top: 25px;
                z-index: 1001;
            }

            .mobile-fullscreen-menu {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(11, 11, 11, 0.98);
                backdrop-filter: blur(15px);
                z-index: 1000;
                flex-direction: column !important;
                justify-content: center !important;
                align-items: center !important;
                gap: 25px !important;
            }

            .mobile-fullscreen-menu.active {
                display: flex !important;
            }

            .mobile-fullscreen-menu a {
                color: #ffffff;
                text-decoration: none;
                font-size: 22px;
                letter-spacing: 4px;
                font-weight: bold;
                padding: 10px;
                display: block !important;
                width: 100%;
                text-align: center;
                transition: opacity 0.3s;
            }

            .music-art {
                width: 240px;
                height: 240px;
            }

            .video-art {
                width: 88vw;
                height: 48vw;
            }

            .footer {
                flex-direction: column-reverse;
                align-items: center;
                text-align: center;
                gap: 8px;
                padding: 15px;
                font-size: 9px;
            }

            .cookie-icon-btn {
                bottom: 15px;
                left: 15px;
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol MENU khusus HP -->
    <button class="menu-toggle" onclick="toggleMobileMenu()">MENU</button>

    <!-- Navigasi Komputer -->
    <nav class="desktop-nav">
        <a href="#" onclick="showHome(); return false;">HOME</a>
        <a onclick="showSection('videoModal')">VIDEO</a>
        <a onclick="showSection('musicModal')">MUSIC</a>
    </nav>

    <!-- Menu Fullscreen HP -->
    <div id="mobileMenu" class="mobile-fullscreen-menu">
        <a href="#" onclick="toggleMobileMenu(); showHome(); return false;">HOME</a>
        <a onclick="toggleMobileMenu(); showSection('musicModal');">MUSIC</a>
        <a onclick="toggleMobileMenu(); showSection('videoModal');">VIDEO</a>
    </div>

    <!-- Konten Utama (Logo & Tombol Listen Now) -->
    <div id="homeContent" class="content">
        <div class="logo-text">3H3D</div>
        <a href="https://ffm.to/kwiregtori" target="_blank" class="btn-listen">Listen Now</a>
    </div>

    <!-- Bagian Musik (Tampil saat diklik, bisa di-scroll bersama halaman) -->
    <div id="musicModal" class="modal">
        <div class="modal-content">
            <h2>MUSIC</h2>
            <div class="vertical-scroll-container">
                <div class="item-card">

                    <a href="https://ffm.to/kwiregtori" target="_blank" class="btn-action">Get It Now</a>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=600&q=80" alt="Music 2" class="music-art">
                    <a href="https://ffm.to/sogdai-ya" target="_blank" class="btn-action">Get It Now</a>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80" alt="Music 3" class="music-art">
                    <a href="https://ffm.to/toru-re" target="_blank" class="btn-action">Get It Now</a>
                </div>
                <div class="item-card">
                    <img src="https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&w=600&q=80" alt="Music 4" class="music-art">
                    <a href="https://ffm.to/og-wesa" target="_blank" class="btn-action">Get It Now</a>
                </div>
            </div>
            <button class="close-modal-btn" onclick="showHome()">Tutup / Kembali</button>
        </div>
    </div>

    <!-- Bagian Video (Tampil saat diklik, bisa di-scroll bersama halaman) -->
    <div id="videoModal" class="modal">
        <div class="modal-content">
            <h2>VIDEOS</h2>
            <div class="vertical-scroll-container">
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/4yGWl7lwwUY/hqdefault.jpg" alt="Video 1" class="video-art">
                    <a href="https://www.youtube.com/watch?v=4yGWl7lwwUY" target="_blank" class="btn-action">Watch Now</a>
                </div>
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/MJS3ca-VP-8/hqdefault.jpg" alt="Video 2" class="video-art">
                    <a href="https://www.youtube.com/watch?v=MJS3ca-VP-8" target="_blank" class="btn-action">Watch Now</a>
                </div>
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/acjp11UXUeA/hqdefault.jpg" alt="Video 3" class="video-art">
                    <a href="https://www.youtube.com/watch?v=acjp11UXUeA" target="_blank" class="btn-action">Watch Now</a>
                </div>
                <div class="item-card">
                    <img src="https://img.youtube.com/vi/H9o2nzykIso/hqdefault.jpg" alt="Video 4" class="video-art">
                    <a href="https://www.youtube.com/watch?v=H9o2nzykIso" target="_blank" class="btn-action">Watch Now</a>
                </div>
            </div>
            <button class="close-modal-btn" onclick="showHome()">Tutup / Kembali</button>
        </div>
    </div>

    <!-- Footer Bawah Mengikuti Alur Scroll Halaman -->
    <div class="footer">
        <span>© 2026 3H3D OFFICIAL. ALL RIGHTS RESERVED. TERMS AND CONDITIONS | PRIVACY POLICY</span>
        <div class="social-icons">
            <a href="https://www.facebook.com/3h3dofficial" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://x.com/3h3dofficial" target="_blank" title="X"><svg width="15" height="15" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
            <a href="https://www.instagram.com/3h3dofficial" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://www.youtube.com/@3h3dofficial" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
        </div>
    </div>

    <!-- Ikon Cookie -->
    <div class="cookie-icon-btn" onclick="alert('Pengaturan Cookie & Privasi aktif untuk 3H3D.')" title="Privacy & Cookie Preferences">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M21.5 11.5c-.3-.1-.6 0-.8.2-.5.5-1.2.8-2 .8-1.7 0-3-1.3-3-3 0-.8.3-1.5.8-2 .2-.2.3-.5.2-.8-.1-.3-.4-.5-.7-.4C13.8 7.1 12 9.3 12 12c0 2.8 2.2 5 5 5 2.7 0 4.9-1.8 5.3-4.3 0-.3-.2-.6-.5-.7zM17 14c-.6 0-1-.4-1-1s.4-1 1-1 1 .4 1 1-.4 1-1 1zm-4-7.5c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1zm-6 3c0-.3-.2-.5-.5-.5h-2c-.3 0-.5.2-.5.5v2c0 .3.2.5.5.5h2c0 .3.2.5.5.5v-2zm2 7c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c0 .3.2.5.5.5h1c0 .3.2.5.5.5v-1z"/></svg>
    </div>

    <!-- JavaScript -->
    <script>
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobileMenu');
            mobileMenu.classList.toggle('active');
        }

        function showSection(sectionId) {
            document.getElementById('homeContent').style.display = 'none';
            document.getElementById('musicModal').style.display = 'none';
            document.getElementById('videoModal').style.display = 'none';
            
            document.getElementById(sectionId).style.display = 'flex';
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function showHome() {
            document.getElementById('musicModal').style.display = 'none';
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('homeContent').style.display = 'flex';
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>

</body>
</html>
